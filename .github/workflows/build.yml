name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # OWNER: ${{ github.repository_owner }}
  OWNER_IMAGE: ${{ github.repository }}
  # Set to "" to publish container on tags only
  # Set to "<branch-name>" to also publish on every push to <branch-name>
  PUBLISH_BRANCH: "main"
  DEV_BRANCH: dev

jobs:

  env:
    name: Setup environment variables
    # Can't pass env to a child workflow, so need to set them as an output
    runs-on: ubuntu-24.04
    outputs:
      push: ${{ steps.image.outputs.push }}
      image: ${{ steps.image.outputs.image }}
      registry: ${{ env.REGISTRY }}
    steps:
      - name: Image name and should it be pushed
        id: image
        run: |
          PUSH="${{ github.event_name == 'push' &&
            (
              github.ref == format('refs/heads/{0}', env.PUBLISH_BRANCH) ||
              github.ref == format('refs/heads/{0}', env.DEV_BRANCH) ||
              startsWith(github.ref, 'refs/tags/')
            )
          }}"
          echo "push=$PUSH" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.OWNER_IMAGE }}" >> $GITHUB_OUTPUT

      # - name: Docker meta
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ steps.image.outputs.image }}

  build-all:
    needs:
      - env
    name: Build a hierarchy of images
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      path: .
      image: "${{ needs.env.outputs.image }}"
      push: "${{ needs.env.outputs.push }}"
      registry: "${{ needs.env.outputs.registry }}"
