name: Build image
on:
  workflow_call:
    inputs:
      path:
        required: true
        type: string
      image:
        required: true
        type: string
      parent:
        required: true
        type: string
      push:
        required: true
        type: string
      registry:
        required: true
        type: string
    outputs:
      digest:
        description: Digest of the fat multi-arch index
        value: ${{ jobs.merge.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:

  # Build a multi-arch image using native runners, based on
  # https://github.com/sredevopsorg/multi-arch-docker-github-workflow/blob/0fe24c85ac35652bc7eb4e0788f20dbcc05e9643/.github/workflows/multi-build.yaml

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    steps:

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          images: ${{ inputs.image }}
      
      - name: Docker meta debug
        run: echo "$DOCKER_METADATA_OUTPUT_JSON" | jq

      # - name: Add arch to metadata
      #   id: meta
      #   run: |
      #     # echo "push=$PUSH" >> $GITHUB_OUTPUT
      #     # echo "image=${{ env.REGISTRY }}/${{ env.OWNER_IMAGE }}" >> $GITHUB_OUTPUT
      #     echo json=$(jq '.tags = (.tags | map(. + "-ARCH")) | ."tag-names" = (."tag-names" | map(. + "-ARCH"))' <<< "$DOCKER_METADATA_OUTPUT_JSON") >> $GITHUB_OUTPUT
        # env:
        #   DOCKER_METADATA_OUTPUT_JSON: ${{ inputs.docker_metadata }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        if: ${{ inputs.push == 'true' }}
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to container registry
        id: build
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:${{ inputs.path }}"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ inputs.push != 'true' }}
          push: ${{ inputs.push == 'true' }}
          build-args: PARENT_IMAGE=${{ inputs.parent }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir build-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "build-digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: build-digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Merges Docker manifests for the different platforms
    name: Merge manifests
    runs-on: ubuntu-24.04
    needs:
      - build
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    if: ${{ inputs.push == 'true' }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: build-digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: build-digests
        run: |
          # map meta.tags to --tag=tag1 --tag=tag2
          # map meta.annotations to --annotations=annotation
          # - remove manifest: key prefix

          docker buildx imagetools create \
            \
            $(jq -cr '.tags | map("--tag=" + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            \
            $(jq -cr '.annotations | map(sub("^manifest:"; "")) | map("--annotation=index:" + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            \
            $(printf '${{ inputs.image }}@sha256:%s ' *)

      - name: Inspect image and get sha256 of fat index
        id: index
        run: |
          docker buildx imagetools inspect "${{ inputs.image }}:$DOCKER_METADATA_OUTPUT_VERSION"

          printf "digest=sha256:%s\n" $(docker buildx imagetools inspect "${{ inputs.image }}:$DOCKER_METADATA_OUTPUT_VERSION" --raw | sha256sum | awk '{print $1}') >> $GITHUB_OUTPUT
